# Dedicated Chapter3 V2 preview only. Never deploy to mudagii production Pages.
name: Chapter3 V2 Independent GitHub Pages Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Chapter3 isolated source
        uses: actions/checkout@v4
        with:
          repository: mudagiri/mudagii
          # Frozen QA PASS SHA. Do not automatically publish newer Draft PR commits.
          ref: 7f5b0a16686a4b1c65484b77ae847171fea0361a
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build demo in local-only mode
        env:
          VITE_CHAPTER2_V32: "1"
          VITE_CHAPTER3_V2: "1"
          VITE_MUDAGIRI_GAS_URL: ""
          VITE_MONEY_PERSONALITY_GAS_URL: ""
          VITE_MONEY_PERSONALITY_DATA_COHORT: "PILOT"
        run: |
          npm ci --ignore-scripts
          node scripts/qa-chapter3-v2-counterfactual.mjs
          node scripts/qa-chapter3-v2-handoff.mjs
          node scripts/qa-chapter3-v2-result-narrative.mjs
          npm run build
          node scripts/package-chapter3-v2-github-pages.mjs
          test -f github-pages-chapter3-v2-bundle/chapter3-v2-preview.html
          test -f github-pages-chapter3-v2-bundle/pilot/chapter2-v32/pilot/money-type/index.html
          test -f github-pages-chapter3-v2-bundle/pilot/chapter2-v32/index.html
          test -f github-pages-chapter3-v2-bundle/.nojekyll
          test -d github-pages-chapter3-v2-bundle/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload isolated preview site
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-chapter3-v2-bundle

      - name: Publish Pages from this new demo repository ONLY
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public preview pages and shared app assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mudagiri.github.io"
          # GitHub Pages CDN can briefly lag behind a successful deployment.
          for PAGE in /chapter3-v2-preview.html /pilot/chapter2-v32/ /pilot/chapter2-v32/pilot/money-type/; do
            echo "Checking ${BASE}${PAGE}"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 "${BASE}${PAGE}" -o /tmp/pages-response.html
            test "$(wc -c </tmp/pages-response.html)" -gt 100
            if [[ "$PAGE" == /chapter3-v2-preview.html ]]; then
              grep -q '未来攻略クエスト・再設計試作' /tmp/pages-response.html
            grep -q 'chapter3solo=1' /tmp/pages-response.html
            else
              grep -q 'id="root"' /tmp/pages-response.html
            fi
          done
          ASSET="$(grep -oE 'src="./assets/[^"]+\.js"' /tmp/pages-response.html | head -1 | cut -d'"' -f2)"
          test -n "$ASSET"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 "${BASE}/${ASSET#./}" -o /tmp/chapter3-js
          test "$(wc -c </tmp/chapter3-js)" -gt 100
          # In the nested Chapter1 journey, 3 RPG backgrounds use legacy
          # CSS relative URLs. Verify all six exact-path aliases live in Pages.
          for PREFIX in /pilot/chapter2-v32 /pilot/chapter2-v32/pilot/money-type; do
            for FILE in MP_BG_01_GUILD_HALL.webp MP_BG_02_JOB_UNLOCK.webp MP_BG_03_NEXT_QUEST.webp; do
              curl --head --fail --silent --show-error --location --retry 8 --retry-delay 3 "${BASE}${PREFIX}/assets/mudagiri/backgrounds/money-personality/v1/${FILE}" -o /tmp/chapter3-image-head
            done
          done
          echo "CHAPTER3_V2_LIVE_BACKGROUND_ASSETS_PASS (6 deep-route aliases)"
          echo "CHAPTER3_V2_LIVE_HTTP_SMOKE_PASS (landing + two deep entry pages + JS asset + background aliases)"

